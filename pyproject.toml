[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolgate"
version = "0.1.0"
description = "MCP proxy for GitHub Copilot that exposes only the tools you actually use"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
toolgate = "toolgate.__main__:main"

[tool.setuptools]
packages = ["toolgate"]
